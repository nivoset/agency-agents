name: Lint Blackboard Roles

on:
  pull_request:
    paths:
      - "blackboard/**"
      - "reporting/**"
      - "scripts/blackboard-index.py"
      - "scripts/validate_report.py"
      - "scripts/test_validate_report.py"

jobs:
  lint:
    name: Validate blackboard frontmatter, panels, and index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate roles, panels, tags, and reporting skills
        run: python3 scripts/blackboard-index.py

      - name: Test the report output validator
        run: python3 scripts/test_validate_report.py

      - name: Run agent linter on blackboard roles
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh blackboard/*/*.md

      - name: Check generated files are up to date
        run: |
          python3 scripts/blackboard-index.py --write
          git diff --exit-code blackboard/index.json reporting/README.md
