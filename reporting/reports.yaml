# Registry of report types. Each entry has a skill at reporting/<id with - for _>/SKILL.md.
#
#   title        human name of the report
#   tags         from blackboard/tags.yaml
#   core_fields  columns/headings every producer MUST include (roles may add more).
#                The validator checks they appear in the skill's Template section AND
#                in the Deliverable section of every role that lists this report.
#   universal    true = every role uses it; roles don't list it in `reports`.
#
# Producers are not listed here. They come from each role's `blackboard.reports`,
# and the validator checks that each skill's "Produced by" section matches them exactly.

universal:
  board_note:
    title: Board Note
    tags: [evidence, synthesis]
    core_fields: [kind, body, confidence, refersTo]
  dispatch_return:
    title: Dispatch Return
    tags: [evidence, synthesis]
    core_fields: [status, claims/results, evidence, uncertainty, implication/next action, changed paths]

reports:
  decision_record:
    title: Decision Record
    tags: [synthesis, planning, evidence]
    core_fields: [Resolved scope, Non-goals, "Claims, evidence, and decisions", Blocking questions, completeness pass, Verification evidence]
  ticket_drafts:
